matches:
  - triggers: [ ":-<" ]
    label: "Arrow left (single)"
    replace: "←"
  - triggers: [ ":->" ]
    label: "Arrow right (single)"
    replace: "→"
  - triggers: [ ":=<" ]
    label: "Arrow left (double)"
    replace: "⇐"
  - triggers: [ ":=>" ]
    label: "Arrow right (double)"
    replace: "⇒"
  - triggers: [ ":harr" ]
    label: "Arrow left-right (single stroke)"
    replace: "↔"
  - triggers: [ ":hArr" ]
    label: "Arrow left-right (double stroke)"
    replace: "⇔"
  - triggers: [ ":|^" ]
    label: "Arrow up (single)"
    replace: "↑"
  - triggers: [ ":v|" ]
    label: "Arrow down (single)"
    replace: "↓"
